name: Bootstrap Quran Premium and Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand Quran Premium source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap-src
          mkdir .bootstrap-src
          unzip -q QuranPremiumGitHubAPK_Source.zip -d .bootstrap-src
          rsync -a .bootstrap-src/QuranPremiumGitHubAPK/ ./ --exclude='.git/' --exclude='.github/workflows/'
          rm -rf .bootstrap-src
          rm -f QuranPremiumGitHubAPK_Source.zip BOOTSTRAP_README.md

      - name: Commit full project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m "Import Quran Premium v1.7.0 source"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify project
        run: python scripts/verify_release.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranPremium-v1.7.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
