name: Bootstrap Quran Premium and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-build.yml"

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part.* > /tmp/quran-premium.b64
          base64 --decode /tmp/quran-premium.b64 > /tmp/quran-premium.zip
          unzip -t /tmp/quran-premium.zip
          mkdir -p /tmp/quran-premium-src
          unzip -q /tmp/quran-premium.zip -d /tmp/quran-premium-src
          ROOT_DIR="$(find /tmp/quran-premium-src -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT_DIR"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'bootstrap/' \
            "$ROOT_DIR/" "$GITHUB_WORKSPACE/"
          echo "Project reconstructed from $ROOT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify source
        run: python scripts/verify_release.py

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Commit reconstructed project source
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Quran Premium Android v1.7.0 source"
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuranPremium-v1.7.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
